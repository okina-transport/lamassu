spring.graphql.graphiql.enabled=true

# GraphQL WebSocket configuration
spring.graphql.websocket.path=/subscriptions


org.entur.lamassu.feedproviders=classpath:feedproviders.yml
org.entur.lamassu.targetGbfsVersion=2.3
org.entur.lamassu.baseUrl=http://localhost:8099
org.entur.lamassu.internalLoadBalancer=http://127.0.0.1:8099

org.entur.lamassu.redis.slave.enabled=false
org.entur.lamassu.redis.master.host=0.0.0.0
org.entur.lamassu.redis.master.port=6379

#logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.profiles.active=leader

org.entur.lamassu.enableValidation=true
# org.entur.lamassu.gbfs.cache-control.minimum-ttl=10

## Control filtering of virtual stations
org.entur.lamassu.vehicle-filter.include-vehicles-assigned-to-non-virtual-stations=false


server.port=8099

iam.keycloak.admin.client=fakeClient
iam.keycloak.client.secret=fakeSecret
ishtar.interval.millis=1800000
ishtar.server.url=http://localhost:8881
keycloak.auth-server-url=fakeURL
keycloak.realm=fakeRealm

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://0.0.0.0:61616?jms.redeliveryPolicy.maximumRedeliveries=0
spring.activemq.password=admin
spring.activemq.pooled=true
spring.activemq.user=admin

logging.level.org.springframework.security=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://mobi-iti-ara.dev.okina.fr/auth/realms/Mobi-iti
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://mobi-iti-ara.dev.okina.fr/auth/realms/Mobi-iti